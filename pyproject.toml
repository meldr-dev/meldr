[project]
name = "meldr"
version = "0.1.0"
description = "AI-assisted data harmonization: LLM-proposed, deterministically executed mappings to canonical entities."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "pydantic>=2.6",
    "polars>=1.0",
    "pyarrow>=15",
    "duckdb>=1.0",
    "pyyaml>=6",
    "httpx>=0.27",
    "tenacity>=8",
    "rapidfuzz>=3",
    "jinja2>=3.1",
]

[project.optional-dependencies]
cli = ["typer>=0.12", "rich>=13"]
anthropic = ["anthropic"]
openai = ["openai"]
litellm = ["litellm"]
sql = ["sqlalchemy>=2"]
xlsx = ["openpyxl"]
docs = ["pypdf", "python-docx", "openpyxl", "beautifulsoup4"]
local-embed = ["sentence-transformers"]
media = ["faster-whisper"]
fsspec = ["fsspec>=2024.2"]
s3 = ["fsspec>=2024.2", "s3fs>=2024.2"]
gcs = ["fsspec>=2024.2", "gcsfs>=2024.2"]
azure = ["fsspec>=2024.2", "adlfs>=2024.2"]
sftp = ["fsspec>=2024.2", "sshfs>=2024.2"]
lancedb = ["lancedb"]
qdrant = ["qdrant-client"]
pgvector = ["psycopg[binary]", "pgvector"]
snowflake = ["sqlalchemy>=2", "snowflake-sqlalchemy"]
bigquery = ["sqlalchemy>=2", "sqlalchemy-bigquery"]
databricks = ["sqlalchemy>=2", "databricks-sqlalchemy"]
dlt = ["dlt>=1.17"]
chromadb = ["chromadb>=1.5"]
delta = ["deltalake>=1.0"]
iceberg = ["pyiceberg>=0.9"]
otel = ["opentelemetry-api>=1.25,<2"]
all = ["meldr[cli,anthropic,openai,sql,xlsx,docs,lancedb,otel]"]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "hypothesis",
    "respx",
    "faker",
    "ruff",
    "mypy",
    "types-PyYAML",
    "pandas",
    "fsspec>=2024.2",
    "fastapi>=0.115,<1",
    "flask>=3.0,<4",
    "opentelemetry-sdk>=1.25,<2",
]

[project.scripts]
meldr = "meldr.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meldr"]

[tool.ruff]
line-length = 100
target-version = "py310"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "S"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108", "S311", "S608"]
"src/meldr/eval/synth.py" = ["S311", "SIM905"]  # seeded RNG; word lists as strings

[tool.mypy]
python_version = "3.10"
files = ["src"]
ignore_missing_imports = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "meldr.core.*",
    "meldr.llm.*",
    "meldr.transforms.*",
    "meldr.mapping.*",
    "meldr.execution.*",
]
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: end-to-end tests on synthetic data",
    "live_llm: calls a real LLM provider; skipped without keys",
    "slow: long-running performance tests",
]
addopts = "-m 'not slow'"

[tool.coverage.run]
source = ["meldr"]
